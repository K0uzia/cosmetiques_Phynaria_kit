<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vestiaire Phynaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Concept : l'armoire d'un personnage. Colonne des thèmes et de leurs ensembles à gauche, vitrine à droite ; chaque ensemble impose sa teinte. */
:root{
  color-scheme:dark;
  --fond:#14131b;--creux:#0e0d13;--surface:#1d1b26;--surface2:#282533;--trait:#3a3648;--texte:#eeebf4;--doux:#a9a4b8;
  --teinte:#b9a7e8;--sur-teinte:#16131f;--ok:#7fd49b;--alerte:#e8b45f;
  --titre:"Alegreya SC",Georgia,serif;--corps:"Alegreya Sans","Segoe UI",system-ui,sans-serif;--chiffre:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--texte);font:16px/1.45 var(--corps)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.page{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--creux);border-right:1px solid var(--trait);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.marque{font:700 25px/1.05 var(--titre);padding:0 8px}
.marque small{display:block;font:400 13px/1.4 var(--corps);color:var(--doux);margin-top:6px}
.rubrique{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);padding:0 8px;margin:0 0 6px}
/* Navigation : modèle de la coquille d'administration (boîte à outils Kouzia, gabarits/admin-coquille) :
   groupes titrés, entrées pleine largeur à compteur, entrée courante marquée par le fond et la graisse, jamais par une bordure latérale. */
.nav{display:grid;gap:16px}
.nav ul{display:grid;gap:1px;margin:0;padding:0;list-style:none}
.nav__titre{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);text-align:left}
.nav__lien{--c:var(--texte);display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:7px;font-size:15px;font-weight:500;color:var(--doux);text-align:left;transition:background-color .15s,color .15s}
.nav__titre:hover,.nav__lien:hover{color:var(--texte);background:var(--surface)}
.nav__titre[aria-pressed=true],.nav__lien[aria-pressed=true]{color:var(--texte);background:var(--surface2)}
.nav__lien[aria-pressed=true]{font-weight:700}
.nav__texte{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.compteur{min-width:1.7em;padding:0 .45em;border-radius:999px;font:700 12px/1.65 var(--chiffre);text-align:center;color:var(--doux);background:var(--surface)}
.nav__titre .compteur{background:none;font-weight:400}
.nav__lien[aria-pressed=true] .compteur{color:var(--sur-teinte);background:var(--c)}
.masque{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){.nav__lien{transition:none}}
@media (forced-colors:active){.nav__titre[aria-pressed=true],.nav__lien[aria-pressed=true]{outline:2px solid CanvasText}}
.etat-direct{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--trait);font-size:13px;color:var(--doux);display:flex;gap:8px;align-items:flex-start}
.point{width:8px;height:8px;border-radius:50%;background:var(--alerte);margin-top:6px;flex:none}
.etat-direct.actif .point{background:var(--ok)}
main{min-width:0;padding:22px 26px 50px}
.barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
#recherche{flex:1 1 240px;min-width:0;background:var(--surface);border:1px solid var(--trait);border-radius:7px;color:var(--texte);padding:9px 12px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--trait);border-radius:7px;overflow:hidden}
.seg button{padding:8px 13px;color:var(--doux);background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--surface2);color:var(--texte);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.cats button{padding:4px 12px;border:1px solid var(--trait);border-radius:6px;color:var(--doux);font-size:15px}
.cats button:hover{color:var(--texte)}
.cats button[aria-pressed=true]{background:var(--texte);border-color:var(--texte);color:var(--fond);font-weight:700}
.section{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;--teinte:var(--c)}
.section h2{font:700 24px/1.1 var(--titre);margin:0;color:var(--teinte);text-wrap:balance}
.section span{color:var(--doux);font-size:14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
/* Carte : modèle composants/cartes de la boîte à outils (un seul déclencheur étiré sur le titre, méta après le titre dans le code). */
.carte{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--trait);border-radius:10px;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.carte:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,var(--trait));box-shadow:0 10px 26px #0007}
.carte:focus-within{outline:2px solid var(--c);outline-offset:2px}
.carte .fen{order:-1;border-bottom:1px solid var(--trait)}
.carte .fen::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--c)}
.carte__titre{margin:0;font:700 18px/1.2 var(--titre);overflow-wrap:anywhere}
.carte__lien{all:unset;cursor:pointer}
.carte__lien::after{content:"";position:absolute;inset:0;z-index:1}
.carte__lien:focus-visible{outline:none}
.corps-carte{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{color:var(--doux);font-size:14px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 0;padding:0;list-style:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12.5px;color:var(--doux);background:var(--surface2)}
.badge svg{width:13px;height:13px;flex:none}
.fen{position:relative;overflow:hidden;aspect-ratio:1;background:var(--creux);max-width:100%}
.fen img{position:absolute;left:0;top:0;max-width:none;display:block}
.fen img.vignette{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.carte:hover .fen img.vignette{transform:scale(1.04)}
.vide{height:100%;display:grid;place-items:center;color:var(--doux);font-size:14px;padding:12px;text-align:center}
.neuf{position:absolute;right:8px;top:8px;z-index:2;background:var(--ok);color:#0d2415;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.rien{color:var(--doux);padding:50px 0;text-align:center}
/* Fiche : modèle composants/dialogue (dialog natif, en-tête, corps qui défile seul, focus rendu au déclencheur). */
dialog{width:fit-content;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);background:var(--surface);color:var(--texte);border:1px solid var(--trait);padding:0;border-radius:12px;overflow:hidden;flex-direction:column}
dialog[open]{display:flex}
dialog::backdrop{background:#07060bd9}
.fiche-tete{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--trait);background:linear-gradient(90deg,color-mix(in srgb,var(--teinte) 14%,transparent),transparent 60%)}
.fiche-tete h3{font:700 28px/1.1 var(--titre);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.sous{color:var(--doux);margin-top:3px;font-size:15px}
.sous b{color:var(--teinte);font-weight:600}
.fiche-tete .outils{margin-left:auto;display:flex;gap:6px;flex:none}
.icone-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;color:var(--doux);background:var(--surface2)}
.icone-btn:hover{color:var(--texte);background:var(--trait)}
.icone-btn:disabled{opacity:.35;cursor:default}
.icone-btn svg{width:20px;height:20px}
.masque{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.fiche{--w:max(300px,min(600px,calc(100dvh - 300px),calc(100vw - 400px)));display:grid;grid-template-columns:calc(var(--w) + 32px) 310px;overflow-x:hidden;min-height:0;overflow:auto;scrollbar-color:var(--trait) transparent}
.scene{background:var(--creux);padding:14px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px;box-sizing:content-box}
/* Onglets soulignés : modèle composants/onglets (flèches, Début, Fin, tabindex itinérant). */
.vues{display:flex;flex-wrap:wrap;gap:4px 18px;border-bottom:1px solid var(--trait)}
.vues button{padding:8px 2px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--doux);font-size:15px;font-weight:600}
.vues button:hover{color:var(--texte)}
.vues button[aria-selected=true]{color:var(--texte);border-bottom-color:var(--teinte)}
.etats{display:flex;flex-wrap:wrap;gap:6px}
.etats button{padding:4px 11px;border:1px solid var(--trait);border-radius:999px;font-size:14px;color:var(--doux)}
.etats button:hover:not(:disabled){color:var(--texte);border-color:var(--doux)}
.etats button:disabled{opacity:.4;cursor:default}
.etats button[aria-pressed=true]{background:var(--teinte);border-color:var(--teinte);color:var(--sur-teinte);font-weight:700}
#vue{display:grid;place-items:center;min-height:0}
#vue img.pleine{width:100%;display:block}
#vue img.tex{image-rendering:pixelated;display:block;width:100%;max-width:512px;margin:auto;background:repeating-conic-gradient(#2a2733 0 25%,#1c1a24 0 50%) 0 0/24px 24px}
#vue .fen{width:100%;border-radius:8px}
/* Zoom des planches et textures : clic pour zoomer à l'endroit visé, le zoom suit le pointeur, nouveau clic pour revenir. */
.zoom{position:relative;width:100%;overflow:hidden;border-radius:8px;cursor:zoom-in}
.zoom > *{transition:transform .2s;transform-origin:50% 50%}
.zoom.actif{cursor:zoom-out}
.zoom.actif > *{transform:scale(var(--z,2.5))}
.decoupe{position:relative;overflow:hidden;width:100%;aspect-ratio:1}
.decoupe img{position:absolute;left:0;top:0;max-width:none;display:block}
/* Vue 3D : glisser pour tourner, molette ou pincement pour zoomer, double-clic pour recadrer. */
.v3d{width:100%;position:relative}
.v3d canvas{display:block;width:100%;aspect-ratio:1;border-radius:8px;background:var(--creux);touch-action:none;cursor:grab}
.v3d canvas:active{cursor:grabbing}
.v3d canvas:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.v3d__barre{display:flex;align-items:center;gap:8px;margin-top:8px}
.v3d__barre input[type=range]{flex:1;min-width:0;accent-color:var(--teinte)}
.v3d__temps{font:12px var(--chiffre);color:var(--doux);min-width:7ch;text-align:right}
.v3d__bascule{padding:6px 11px;border:1px solid var(--trait);border-radius:999px;font-size:13px;color:var(--doux)}
.v3d__bascule[aria-pressed=true]{background:var(--teinte);border-color:var(--teinte);color:var(--sur-teinte);font-weight:700}
.v3d__options{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.v3d__options .v3d__bascule,.v3d__options select{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(4px)}
.v3d__options .v3d__bascule[aria-pressed=true]{background:var(--teinte)}
.v3d__options select{padding:5px 8px;border:1px solid var(--trait);border-radius:999px;background:var(--surface);color:var(--texte);font:inherit;font-size:13px}
.v3d__aide{color:var(--doux);font-size:13px;margin:6px 0 0}
.anim-etat{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:var(--creux)}
.zoom:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.aide-zoom{display:flex;justify-content:space-between;gap:10px;color:var(--doux);font-size:13px;margin:6px 0 0}
.aide-zoom a{color:var(--doux)}
.aide-zoom a:hover{color:var(--texte)}
.legende{color:var(--doux);font-size:14px;margin:0;text-align:center}
.cote{padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.rubrique{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);margin:0 0 8px}
.actions{display:grid;gap:8px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--teinte);color:var(--sur-teinte);font-weight:700;padding:11px;border-radius:8px;text-decoration:none}
.dl:hover{filter:brightness(1.1)}
.dl svg{width:18px;height:18px}
.secondaire{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border:1px solid var(--trait);border-radius:8px;color:var(--doux);font-size:14px}
.secondaire svg{width:18px;height:18px;flex:none}
.secondaire:hover{color:var(--texte);border-color:var(--doux)}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.chiffres div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.chiffres dt{font-size:12px;color:var(--doux)}
.chiffres dd{margin:2px 0 0;font:700 17px/1.2 var(--chiffre)}
.jauge{display:grid;gap:4px;font-size:14px}
.jauge div:first-child{display:flex;justify-content:space-between;gap:8px;color:var(--doux)}
.jauge b{font:12px var(--chiffre);color:var(--texte)}
.rail{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--teinte)}
.avec{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.avec button{display:flex;align-items:center;gap:10px;width:100%;padding:4px 6px;border-radius:6px;text-align:left;font-size:14px;color:var(--doux)}
.avec button:hover{color:var(--texte);background:var(--surface2)}
.avec img,.avec .sans{width:34px;height:34px;flex:none;border-radius:5px;background:var(--creux);border:1px solid var(--trait);object-fit:cover}
.avec .nom-avec{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avec .cat-avec{font-size:12px;color:var(--doux);flex:none}
.note{font-size:14px;color:var(--doux);margin:0}
.chemin{font:12px var(--chiffre);color:var(--doux);overflow-wrap:anywhere}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ok);color:#0d2415;font-weight:700;padding:10px 14px;border-radius:6px;max-width:calc(100vw - 36px)}
@media (max-width:860px){
  .page{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--trait);padding:16px}
  .etat-direct{margin-top:0}
  main{padding:16px 16px 40px}
  .fiche{grid-template-columns:minmax(0,1fr)}
  .scene{box-sizing:border-box}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0}
  .fiche-tete h3{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.zoom > *{transition:none}.carte,.fen img.vignette{transition:none}.carte:hover{transform:none}.carte:hover .fen img.vignette{transform:none}}
@media (forced-colors:active){.vues button[aria-selected=true],.etats button[aria-pressed=true]{outline:2px solid CanvasText}}
</style></head><body>
<div class="page">
<aside>
  <div class="marque">Vestiaire<small>Cosmétiques Phynaria</small></div>
  <nav class="nav" id="ensembles" aria-label="Thèmes et ensembles"></nav>
  <div class="etat-direct" id="direct"><span class="point"></span><span id="direct-txt"></span></div>
</aside>
<main>
  <div class="barre">
    <input type="search" id="recherche" placeholder="Chercher un cosmétique, un ensemble, un thème…" aria-label="Chercher un cosmétique">
    <span class="seg" id="tri" role="group" aria-label="Ranger par"></span>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Catégories"></div>
  <div id="liste"></div>
</main>
</div>
<dialog id="dlg" aria-labelledby="titre">
  <header class="fiche-tete">
    <div><h3 id="titre"></h3><div class="sous" id="sous"></div></div>
    <div class="outils">
      <button class="icone-btn" type="button" id="prec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg><span class="masque">Cosmétique précédent</span></button>
      <button class="icone-btn" type="button" id="suiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg><span class="masque">Cosmétique suivant</span></button>
      <button class="icone-btn" type="button" id="fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="masque">Fermer la fiche</span></button>
    </div>
  </header>
  <div class="fiche">
    <div class="scene"><div class="vues" id="vues" role="tablist" aria-label="Aperçus"></div><div id="panneau" role="tabpanel"><div id="etats-scene"></div><div id="vue"></div></div></div>
    <div class="cote" id="cote"></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>/*VISIONNEUSE*/</script>
<script>
let D = /*DONNEES*/;
const NOMS_ETATS = {idle:"Repos",walk:"Marche",run:"Course",sneak:"Accroupi",fly:"Vol",glide:"Élytres",fall:"En l'air",swim:"Nage",mount:"Monture",sleep:"Sommeil",attack:"Attaque",hurt:"Blessé"};
const el = (t, p = {}, ...c) => { const e = document.createElement(t); Object.assign(e, p); e.append(...c); return e; };
const joli = n => n.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
const lib = c => D.labels[c] || joli(c);
const teinte = e => D.teintes[e] || "#a9a4b8";
const suffixe = (u, f) => u ? u + "?v=" + f.version : null;
let visibles = [], cat = null, ens = null, th = null, tri = "ensemble", ouvert = null, neufs = new Set();
try { const t = localStorage.getItem("vestiaire-tri"); if (t === "ensemble" || t === "categorie") tri = t; } catch (e) {}
const rang = (liste, v) => { const i = (liste || []).indexOf(v); return i < 0 ? 98 : i; };
const ordreThemes = () => [...new Set(D.fiches.map(f => f.theme))].sort((a, b) => rang(D.themes, a) - rang(D.themes, b) || a.localeCompare(b));
const ordreEns = () => { const n = e => D.fiches.filter(f => f.ensemble === e).length, t = e => (D.fiches.find(f => f.ensemble === e) || {}).theme;
  return [...new Set(D.fiches.map(f => f.ensemble))].sort((a, b) => rang(D.themes, t(a)) - rang(D.themes, t(b)) || rang(D.ordre_ensembles, a) - rang(D.ordre_ensembles, b) || n(b) - n(a) || a.localeCompare(b)); };
const garde = f => (!th || f.theme === th) && (!ens || f.ensemble === ens);
const ordreCat = () => { const o = Object.keys(D.labels); return [...new Set(D.fiches.map(f => f.categorie))].sort((a, b) => (o.indexOf(a) + 1 || 99) - (o.indexOf(b) + 1 || 99)); };

/* Recadre une planche ou un GIF : la première vue de la planche, ou la case d'un état dans le GIF. */
function cadre(url, colonnes, col, rangee, alt, tout_de_suite) {
  const f = el("div", { className: "fen" });
  const img = el("img", { src: url, alt: alt || "", loading: tout_de_suite ? "eager" : "lazy" });
  img.style.width = colonnes * 100 + "%"; img.style.left = -col * 100 + "%"; img.style.top = -rangee * 100 + "%";
  f.append(img); return f;
}
const SVG = "http://www.w3.org/2000/svg";
function icone(d) {
  const s = document.createElementNS(SVG, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true"); s.setAttribute("focusable", "false");
  const p = document.createElementNS(SVG, "path"); p.setAttribute("d", d); s.append(p); return s;
