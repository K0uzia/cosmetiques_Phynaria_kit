<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vestiaire Phynaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Concept : l'armoire d'un personnage. Colonne des thèmes et de leurs ensembles à gauche, vitrine à droite ; chaque ensemble impose sa teinte.
   Sur mobile, la colonne devient un tiroir et une rangée d'ensembles donne l'accès rapide. */
:root{
  color-scheme:dark;
  --fond:#14131b;--creux:#0e0d13;--surface:#1d1b26;--surface2:#282533;--trait:#3a3648;--texte:#eeebf4;--doux:#b3aec2;
  --teinte:#b9a7e8;--sur-teinte:#16131f;--ok:#7fd49b;--alerte:#e8b45f;
  --titre:"Alegreya SC",Georgia,serif;--corps:"Alegreya Sans","Segoe UI",system-ui,sans-serif;--chiffre:"JetBrains Mono",Consolas,monospace;
  --aside:clamp(250px,15vw,300px);--marge:clamp(16px,2vw,40px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--texte);font:16px/1.45 var(--corps)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.masque{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.page{display:grid;grid-template-columns:var(--aside) minmax(0,1fr);min-height:100vh}

/* ---- Panneau latéral ---- */
aside{background:var(--creux);border-right:1px solid var(--trait);padding:22px 14px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px;scrollbar-color:var(--trait) transparent}
aside > *{flex-shrink:0}
.aside-tete{display:flex;align-items:flex-start;gap:8px}
.marque{flex:1;font:700 27px/1.05 var(--titre);padding:0 8px}
.marque small{display:block;font:400 14px/1.4 var(--corps);color:var(--doux);margin-top:6px}
#fermer-filtres{display:none}
.nav{display:grid;gap:14px}
.nav ul{display:grid;gap:1px;margin:0;padding:0;list-style:none}
.nav__tete{display:flex;align-items:center;gap:2px}
.nav__plier{flex:none;display:grid;place-items:center;width:30px;height:36px;border-radius:6px;color:var(--doux)}
.nav__plier:hover{color:var(--texte);background:var(--surface)}
.nav__plier svg{width:15px;height:15px;transition:transform .15s}
.nav__plier[aria-expanded=false] svg{transform:rotate(-90deg)}
.nav ul[hidden]{display:none}
.nav__groupe > ul{margin-left:14px;padding-left:8px;border-left:1px solid var(--trait)}
.nav__groupe:first-of-type > ul{margin:0;padding:0;border:0}
.seg--aside{display:flex;margin:0 4px}
.nav__outils{display:flex;gap:6px;padding:0 4px}
.nav__outils button{flex:1;min-height:32px;padding:5px 6px;border:1px solid var(--trait);border-radius:7px;font-size:13.5px;color:var(--doux)}
.nav__outils button:hover{color:var(--texte);background:var(--surface)}
.nav__outils button:disabled{opacity:.45;cursor:default;background:none}
.seg--aside button{flex:1;padding:8px;font-size:14.5px}
.nav__titre{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);text-align:left}
.nav__lien{--c:var(--texte);display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:7px;font-size:15.5px;font-weight:500;color:var(--doux);text-align:left;transition:background-color .15s,color .15s}
.nav__titre:hover,.nav__lien:hover{color:var(--texte);background:var(--surface)}
.nav__titre[aria-pressed=true],.nav__lien[aria-pressed=true]{color:var(--texte);background:var(--surface2)}
.nav__lien[aria-pressed=true]{font-weight:700}
.nav__texte{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.compteur{min-width:1.9em;padding:0 .5em;border-radius:999px;font:700 12.5px/1.7 var(--chiffre);text-align:center;color:var(--doux);background:var(--surface)}
.nav__titre .compteur{background:none;font-weight:400}
.nav__lien[aria-pressed=true] .compteur{color:var(--sur-teinte);background:var(--c)}
.etat-direct{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--trait);font-size:13.5px;color:var(--doux);display:flex;gap:8px;align-items:flex-start}
.point{width:8px;height:8px;border-radius:50%;background:var(--alerte);margin-top:6px;flex:none}
.etat-direct.actif .point{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.voile{position:fixed;inset:0;z-index:40;background:#07060bb3}
.voile[hidden]{display:none}

/* ---- Segments et boutons communs ---- */
.seg{display:inline-flex;border:1px solid var(--trait);border-radius:8px;overflow:hidden}
.seg button{padding:8px 13px;color:var(--doux);background:var(--surface)}
.seg button:hover{color:var(--texte)}
.seg button[aria-pressed=true]{background:var(--surface2);color:var(--texte);font-weight:700}
.icone-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;color:var(--doux);background:var(--surface2);flex:none}
.icone-btn:hover{color:var(--texte);background:var(--trait)}
.icone-btn:disabled{opacity:.35;cursor:default}
.icone-btn svg{width:20px;height:20px}
.puce{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 12px;border:1px solid var(--trait);border-radius:999px;font-size:14.5px;color:var(--doux);white-space:nowrap}
.puce:hover:not(:disabled){color:var(--texte);border-color:var(--doux)}
.puce[aria-pressed=true]{background:var(--teinte);border-color:var(--teinte);color:var(--sur-teinte);font-weight:700}

/* ---- En-tête de la vitrine ---- */
main{min-width:0;padding:0 var(--marge) 56px}
.entete{position:sticky;top:0;z-index:20;margin:0 calc(-1 * var(--marge));padding:18px var(--marge) 14px;background:color-mix(in srgb,var(--fond) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--trait);display:grid;gap:12px}
.entete__haut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.entete__titre{flex:0 1 auto;min-width:0}
.entete__sur{margin:0;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);min-height:1.2em}
.entete h1{margin:0;font:700 clamp(24px,1.9vw,34px)/1.1 var(--titre);color:var(--teinte)}
.entete__resume{margin:0 0 3px;align-self:flex-end;color:var(--doux);font-size:15px}
.entete__resume b{color:var(--texte);font:700 15px var(--chiffre)}
.entete__outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.recherche{position:relative;flex:1 1 300px;max-width:720px;min-width:0}
.recherche svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--doux);pointer-events:none}
#recherche{width:100%;min-height:42px;background:var(--surface);border:1px solid var(--trait);border-radius:9px;color:var(--texte);padding:9px 40px 9px 40px;font:inherit}
#recherche::placeholder{color:#8f8a9e}
#recherche:focus{border-color:var(--teinte);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teinte) 25%,transparent)}
.recherche kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--chiffre);color:var(--doux);border:1px solid var(--trait);border-radius:5px;padding:1px 6px;pointer-events:none}
#recherche:focus + kbd,#recherche:not(:placeholder-shown) + kbd{display:none}
.filtre-actif{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtre-actif:empty{display:none}
.filtre{--c:var(--teinte);display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 6px 4px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--trait));font-size:14.5px}
.filtre .pastille{width:9px;height:9px}
.filtre button{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--doux)}
.filtre button:hover{background:var(--surface2);color:var(--texte)}
.filtre button svg{width:14px;height:14px}
.effacer{min-height:34px;padding:4px 10px;border-radius:8px;color:var(--doux);font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.effacer:hover{color:var(--texte)}
.filtres-btn{display:none}
.rapides{display:none}

/* ---- Sections et cartes ---- */
.section{--teinte:var(--c);margin-top:34px}
.section__tete{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid color-mix(in srgb,var(--c) 35%,var(--trait))}
.section__tete > div{min-width:0}
.section__theme{margin:0 0 2px;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--doux)}
.section h2{font:700 clamp(24px,1.7vw,30px)/1.1 var(--titre);margin:0;color:var(--teinte);text-wrap:balance}
.section__n{margin-left:auto;flex:none;padding:2px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--trait);color:var(--doux);font-size:14px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(190px,11.5vw,290px),1fr));gap:clamp(14px,1.1vw,22px)}
/* Carte : un seul déclencheur étiré sur le titre, méta après le titre dans le code. */
.carte{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--trait);border-radius:12px;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.carte:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,var(--trait));box-shadow:0 12px 30px #0008}
.carte:focus-within{outline:2px solid var(--c);outline-offset:2px}
.carte .fen{order:-1;border-bottom:1px solid var(--trait)}
.carte .fen::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--c)}
.carte__titre{margin:0;font:700 clamp(17px,1.05vw,20px)/1.2 var(--titre);overflow-wrap:anywhere}
.carte__lien{all:unset;cursor:pointer}
.carte__lien::after{content:"";position:absolute;inset:0;z-index:1}
.carte__lien:focus-visible{outline:none}
.corps-carte{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.meta{color:var(--doux);font-size:14.5px;margin:0}
.meta b{font-weight:500;color:var(--texte)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:auto 0 0;padding:4px 0 0;list-style:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:13.5px;color:#cfcadb;background:var(--surface2)}
.badge svg{width:14px;height:14px;flex:none}
.fen{position:relative;overflow:hidden;aspect-ratio:1;background:var(--creux);max-width:100%}
.fen img{position:absolute;left:0;top:0;max-width:none;display:block}
.fen img.vignette{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.carte:hover .fen img.vignette{transform:scale(1.04)}
.fen canvas.survol3d{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--creux)}
.vide{height:100%;display:grid;place-items:center;color:var(--doux);font-size:14px;padding:12px;text-align:center}
.neuf{position:absolute;right:8px;top:8px;z-index:2;background:var(--ok);color:#0d2415;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.rien{color:var(--doux);padding:60px 0;text-align:center;display:grid;justify-items:center;gap:14px}
.rien button{min-height:40px;padding:6px 16px;border-radius:8px;background:var(--surface2);color:var(--texte)}

/* ---- Fiche (dialog natif) : en-tête, scène, colonne d'infos qui défile seule ----
   La vue reste carrée et prend la plus grande taille qui tient dans la scène (unités de conteneur).
   La largeur de la fiche suit la hauteur de l'écran, pour que la scène ne soit ni écrasée ni vide. */
dialog{--cote:clamp(320px,24vw,500px);width:min(calc(100vw - 32px),calc(100dvh + 560px));height:calc(100dvh - 32px);max-width:none;max-height:none;background:var(--surface);color:var(--texte);border:1px solid var(--trait);padding:0;border-radius:14px;overflow:hidden;flex-direction:column;box-shadow:0 30px 80px #000a}
dialog[open]{display:flex}
dialog::backdrop{background:#07060be0;backdrop-filter:blur(3px)}
.fiche-tete{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--trait);background:linear-gradient(90deg,color-mix(in srgb,var(--teinte) 16%,transparent),transparent 65%)}
.fiche-tete__txt{flex:1;min-width:0}
.fiche-tete h3{font:700 clamp(22px,1.7vw,32px)/1.1 var(--titre);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.sous{color:var(--doux);margin-top:4px;font-size:15px}
.sous b{color:var(--teinte);font-weight:700}
.position{flex:none;font:13px var(--chiffre);color:var(--doux)}
.fiche-tete .outils{display:flex;gap:6px;flex:none}
.fiche{flex:1;display:grid;grid-template-columns:minmax(0,1fr) var(--cote);min-height:0;overflow:hidden;scrollbar-color:var(--trait) transparent}
.scene{background:var(--creux);padding:12px 18px 16px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
#panneau{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
/* Onglets soulignés (flèches, Début, Fin, tabindex itinérant). */
.vues{display:flex;gap:4px 22px;border-bottom:1px solid var(--trait);overflow-x:auto;scrollbar-width:none}
.vues button{flex:none;padding:10px 2px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--doux);font-size:15.5px;font-weight:700;white-space:nowrap}
.vues button:hover{color:var(--texte)}
.vues button[aria-selected=true]{color:var(--texte);border-bottom-color:var(--teinte)}
#etats-scene{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
#etats-scene:empty{display:none}
.etats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.etats button{min-height:34px;padding:4px 13px;border:1px solid var(--trait);border-radius:999px;font-size:14.5px;color:var(--doux)}
.etats button:hover:not(:disabled){color:var(--texte);border-color:var(--doux)}
.etats button:disabled{opacity:.4;cursor:default}
.etats button[aria-pressed=true]{background:var(--teinte);border-color:var(--teinte);color:var(--sur-teinte);font-weight:700}
.evts{gap:6px 8px}
.evts__titre{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);margin-right:4px}
.evts button{border-style:dashed}
#vue{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center}
#vue > *{width:min(100cqw,100cqh);max-width:100%;flex:none}
#vue > .rien,#vue > .cadre-img{width:100%}
#vue .fen{width:100%;border-radius:10px}
/* Images (planches, textures) : la plus grande taille qui tient, zoom au clic à l'endroit visé, le zoom suit le pointeur. */
.cadre-img{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;max-height:100%}
.zoom{position:relative;overflow:hidden;border-radius:10px;cursor:zoom-in;max-width:100%}
.zoom > *{transition:transform .2s;transform-origin:50% 50%}
.zoom.actif{cursor:zoom-out}
.zoom.actif > *{transform:scale(var(--z,2.5))}
.zoom:focus-visible{outline:2px solid var(--teinte);outline-offset:2px}
.zoom img.pleine{display:block;max-width:100%;max-height:calc(100cqh - 34px);width:auto;height:auto}
.zoom img.tex{display:block;image-rendering:pixelated;width:min(100cqw,calc(100cqh - 34px),1024px);height:auto;background:repeating-conic-gradient(#2a2733 0 25%,#1c1a24 0 50%) 0 0/24px 24px}
.decoupe{position:relative;overflow:hidden;width:min(100cqw,calc((100cqh - 34px) * var(--r,1)));aspect-ratio:var(--r,1)}
.decoupe img{position:absolute;left:0;top:0;max-width:none;display:block}
.aide-zoom{display:flex;justify-content:space-between;gap:14px;width:100%;color:var(--doux);font-size:13.5px;margin:0}
.aide-zoom a{color:var(--doux)}
.aide-zoom a:hover{color:var(--texte)}
.anim-etat{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:var(--creux)}
/* Vue 3D : glisser pour tourner, molette ou pincement pour zoomer, double-clic pour recadrer. Les contrôles flottent sur la vue. */
.v3d{position:relative;aspect-ratio:1;container-type:inline-size;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--teinte) 9%,var(--creux)),var(--creux) 70%);border:1px solid var(--trait)}
.v3d canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v3d canvas:active{cursor:grabbing}
.v3d canvas:focus-visible{outline:2px solid var(--teinte);outline-offset:-3px}
.verre{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(6px);border:1px solid var(--trait)}
.v3d__options{position:absolute;top:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 20px)}
.v3d__bascule{min-height:34px;padding:5px 12px;border:1px solid var(--trait);border-radius:999px;font-size:14px;color:var(--texte)}
.v3d__options .v3d__bascule,.v3d__options select{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(6px)}
.v3d__bascule[aria-pressed=true],.v3d__options .v3d__bascule[aria-pressed=true]{background:var(--teinte);border-color:var(--teinte);color:var(--sur-teinte);font-weight:700}
.v3d__options select{min-height:34px;padding:5px 10px;border:1px solid var(--trait);border-radius:999px;color:var(--texte);font:inherit;font-size:14px}
.v3d__aide{position:absolute;left:12px;top:12px;margin:0;font-size:13px;color:var(--doux);pointer-events:none;max-width:45%}
@container (max-width:720px){.v3d__aide{display:none}}
.v3d__barre{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px}
.v3d__barre .icone-btn{background:transparent}
.v3d__barre .icone-btn:hover{background:var(--surface2)}
.v3d__barre input[type=range]{flex:1;min-width:0;accent-color:var(--teinte);height:28px}
.v3d__temps{font:13px var(--chiffre);color:var(--texte);min-width:7ch;text-align:right}
/* Colonne d'infos */
.cote{padding:20px;display:flex;flex-direction:column;gap:22px;min-width:0;min-height:0;overflow:auto;border-left:1px solid var(--trait)}
.rubrique{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--doux);margin:0 0 10px}
.actions{display:grid;gap:8px}
.dl{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;background:var(--teinte);color:var(--sur-teinte);font-weight:700;font-size:16.5px;padding:11px;border-radius:10px;text-decoration:none}
.dl:hover{filter:brightness(1.1)}
.dl svg{width:19px;height:19px}
.secondaire{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px;border:1px solid var(--trait);border-radius:10px;color:var(--doux);font-size:15px}
.secondaire svg{width:18px;height:18px;flex:none}
.secondaire:hover{color:var(--texte);border-color:var(--doux)}
.chiffres{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0}
.chiffres div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.chiffres dt{font-size:13px;color:var(--doux)}
.chiffres dd{margin:2px 0 0;font:700 clamp(18px,1.2vw,22px)/1.2 var(--chiffre)}
.jauges{display:grid;gap:12px}
.jauge{display:grid;gap:5px;font-size:14.5px}
.jauge div:first-child{display:flex;justify-content:space-between;gap:8px;color:var(--doux)}
.jauge b{font:13px var(--chiffre);color:var(--texte)}
.rail{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--teinte);border-radius:3px}
.jauge.haute .rail i{background:var(--alerte)}
.proprietes{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:15px}
.proprietes li{display:flex;gap:9px;align-items:flex-start;color:var(--texte)}
.proprietes svg{width:17px;height:17px;flex:none;margin-top:3px;color:var(--teinte)}
.proprietes .non{color:var(--doux)}
